services:

  postgres:
    image: postgres:16-alpine
    container_name: gpstracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gpstracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gpstracker"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gpstracker-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gpstracker-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gpstracker
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gpstracker-network

volumes:
  postgres_data:
    driver: local

networks:
  gpstracker-network:
    driver: bridge
